<div class="world-map-wrap">
  <p class="map-legend">🗺️ Visited countries highlighted — pins show your passport stamps</p>
  <svg class="world-map" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg" aria-label="World travel map">
    <defs>
      <linearGradient id="ocean" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#dbeafe"/>
        <stop offset="100%" style="stop-color:#e0f2fe"/>
      </linearGradient>
    </defs>
    <rect width="100" height="50" fill="url(#ocean)" rx="2"/>
    <!-- Simplified continents -->
    <ellipse cx="22" cy="22" rx="14" ry="12" fill="#bfdbfe" opacity="0.9"/>
    <ellipse cx="48" cy="18" rx="12" ry="10" fill="#bfdbfe" opacity="0.9"/>
    <ellipse cx="72" cy="22" rx="16" ry="11" fill="#bfdbfe" opacity="0.9"/>
    <ellipse cx="28" cy="38" rx="10" ry="8" fill="#bfdbfe" opacity="0.9"/>
    <ellipse cx="88" cy="36" rx="8" ry="7" fill="#bfdbfe" opacity="0.9"/>
    {% for pin in map_pins %}
    <g class="map-pin {% if pin.demo %}demo-pin{% endif %}" transform="translate({{ pin.x }}, {{ pin.y }})">
      <circle r="1.8" fill="#0ea5e9" stroke="#fff" stroke-width="0.4"/>
      <circle r="3" fill="#0ea5e9" opacity="0.25"/>
      <title>{{ pin.country }}{% if pin.city %} — {{ pin.city }}{% endif %}</title>
    </g>
    {% endfor %}
  </svg>
  <ul class="map-country-list">
    {% for pin in map_pins %}
    <li><span class="map-dot"></span> {{ pin.country }}{% if pin.demo %} <small>(demo)</small>{% endif %}</li>
    {% endfor %}
  </ul>
</div>

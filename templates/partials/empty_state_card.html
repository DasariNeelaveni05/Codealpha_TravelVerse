<div class="empty-state-card glass-card">
  {% if image_url %}
  <div class="empty-state-image" style="background-image: url('{{ image_url }}')"></div>
  {% else %}
  <div class="empty-state-icon">{{ icon|default:"🌍" }}</div>
  {% endif %}
  <h3>{{ title }}</h3>
  <p>{{ message }}</p>
  {% if cta_url and cta_label %}
  <a href="{{ cta_url }}" class="btn btn-primary">{{ cta_label }}</a>
  {% endif %}
</div>
